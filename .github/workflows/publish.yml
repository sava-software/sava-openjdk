name: Publish OpenJDK base image

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # GA (General Availability) builds.
          - target: debian
            release_type: ga
            java_version: "27"
            java_build: "35"
            java_version_hash: "55ce5470a6294008af0057ff4626d0e5"
            jdk_sha256_x64: "95fc37eb3a18a27a26d5904c2d89d52bace8dafa9a078ca27f4747fbc4bf070b"
            jdk_sha256_aarch64: "da4e9dde1fff90204739e969187bab4751bd59a2a1c479672e1a1810f7dd23ea"
            jdk_tag: "27"
            os_tag: "debian-trixie"
          - target: alpine
            release_type: ga
            java_version: "27"
            java_build: "35"
            java_version_hash: "55ce5470a6294008af0057ff4626d0e5"
            jdk_sha256_x64: "95fc37eb3a18a27a26d5904c2d89d52bace8dafa9a078ca27f4747fbc4bf070b"
            jdk_sha256_aarch64: "da4e9dde1fff90204739e969187bab4751bd59a2a1c479672e1a1810f7dd23ea"
            jdk_tag: "27"
            os_tag: "alpine-3.24"
          # EA (Early Access) builds. 28 build 15 is the latest build published on the
          # early-access download path (https://jdk.java.net/28/).
          - target: debian
            release_type: ea
            java_version: "28"
            java_build: "15"
            java_version_hash: ""
            jdk_sha256_x64: "621528ea2be9bcfc995c350d7db6dc6270a212de980dc31e5c1626612bad469d"
            jdk_sha256_aarch64: "09d100ebcc0a205f809834f79b0bdf5637cc52d2c5ec3ab30a88edba093b2b5f"
            jdk_tag: "28-ea15"
            os_tag: "debian-trixie"
          - target: alpine
            release_type: ea
            java_version: "28"
            java_build: "15"
            java_version_hash: ""
            jdk_sha256_x64: "621528ea2be9bcfc995c350d7db6dc6270a212de980dc31e5c1626612bad469d"
            jdk_sha256_aarch64: "09d100ebcc0a205f809834f79b0bdf5637cc52d2c5ec3ab30a88edba093b2b5f"
            jdk_tag: "28-ea15"
            os_tag: "alpine-3.24"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve Docker Hub image name
        id: dockerhub
        run: |
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            image="${{ vars.DOCKERHUB_IMAGE }}"
            if [ -z "${image}" ]; then
              image="${{ vars.DOCKERHUB_USERNAME }}/sava-openjdk"
            fi
            echo "image=${image}" >> "${GITHUB_OUTPUT}"
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Docker setup (GHCR)
        uses: sava-software/sava-build/.github/actions/docker-setup@main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.release_type }} ${{ matrix.jdk_tag }} ${{ matrix.os_tag }})
        uses: sava-software/sava-build/.github/actions/docker-build-image@main
        with:
          image: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && steps.dockerhub.outputs.image || '' }}
          dockerfile: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            JAVA_RELEASE_TYPE=${{ matrix.release_type }}
            JAVA_VERSION=${{ matrix.java_version }}
            JAVA_BUILD=${{ matrix.java_build }}
            JAVA_VERSION_HASH=${{ matrix.java_version_hash }}
            JDK_SHA256_X64=${{ matrix.jdk_sha256_x64 }}
            JDK_SHA256_AARCH64=${{ matrix.jdk_sha256_aarch64 }}
          tags: |
            type=raw,value=${{ matrix.jdk_tag }}-${{ matrix.os_tag }}
          cache-from: type=gha,scope=${{ matrix.release_type }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release_type }}-${{ matrix.target }}
