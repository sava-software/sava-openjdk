name: Publish OpenJDK base image

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # GA (General Availability) builds.
          - target: debian
            release_type: ga
            java_version: "26.0.2.1"
            java_build: "1"
            java_version_hash: "3b8e6c7ec6274148a7aa15e7e7dfb53c"
            jdk_sha256_x64: "a1489256029b389ce6ee52da0de1d01496c5df1776d6870241fe4823b998ea61"
            jdk_sha256_aarch64: "b96b265a4a1a36c02454148891aa58ca63303cbc2d1b7979c33b4fe99e09117b"
            jdk_tag: "26.0.2.1"
            os_tag: "debian-trixie"
          - target: alpine
            release_type: ga
            java_version: "26.0.2.1"
            java_build: "1"
            java_version_hash: "3b8e6c7ec6274148a7aa15e7e7dfb53c"
            jdk_sha256_x64: "a1489256029b389ce6ee52da0de1d01496c5df1776d6870241fe4823b998ea61"
            jdk_sha256_aarch64: "b96b265a4a1a36c02454148891aa58ca63303cbc2d1b7979c33b4fe99e09117b"
            jdk_tag: "26.0.2.1"
            os_tag: "alpine-3.24"
          # EA (Early Access) builds. 27 build 34 is the latest build published on the
          # early-access download path; 27 builds 35+ are release candidates and are
          # published under the GA path instead (JDK 27 GA is scheduled for 2026-09-15).
          - target: debian
            release_type: ea
            java_version: "27"
            java_build: "34"
            java_version_hash: ""
            jdk_sha256_x64: "e82f0b585355fa9b8aa309711cb67afa0d87a6c4ddc5d583951a412e46512f08"
            jdk_sha256_aarch64: "fd51c0306ecd1d15e2e9f9bf91c7b339c7194517de3d9a46eb9007a340cf046e"
            jdk_tag: "27-ea34"
            os_tag: "debian-trixie"
          - target: alpine
            release_type: ea
            java_version: "27"
            java_build: "34"
            java_version_hash: ""
            jdk_sha256_x64: "e82f0b585355fa9b8aa309711cb67afa0d87a6c4ddc5d583951a412e46512f08"
            jdk_sha256_aarch64: "fd51c0306ecd1d15e2e9f9bf91c7b339c7194517de3d9a46eb9007a340cf046e"
            jdk_tag: "27-ea34"
            os_tag: "alpine-3.24"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve Docker Hub image name
        id: dockerhub
        run: |
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            image="${{ vars.DOCKERHUB_IMAGE }}"
            if [ -z "${image}" ]; then
              image="${{ vars.DOCKERHUB_USERNAME }}/sava-openjdk"
            fi
            echo "image=${image}" >> "${GITHUB_OUTPUT}"
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Docker setup (GHCR)
        uses: sava-software/sava-build/.github/actions/docker-setup@main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.release_type }} ${{ matrix.jdk_tag }} ${{ matrix.os_tag }})
        uses: sava-software/sava-build/.github/actions/docker-build-image@main
        with:
          image: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && steps.dockerhub.outputs.image || '' }}
          dockerfile: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            JAVA_RELEASE_TYPE=${{ matrix.release_type }}
            JAVA_VERSION=${{ matrix.java_version }}
            JAVA_BUILD=${{ matrix.java_build }}
            JAVA_VERSION_HASH=${{ matrix.java_version_hash }}
            JDK_SHA256_X64=${{ matrix.jdk_sha256_x64 }}
            JDK_SHA256_AARCH64=${{ matrix.jdk_sha256_aarch64 }}
          tags: |
            type=raw,value=${{ matrix.jdk_tag }}-${{ matrix.os_tag }}
          cache-from: type=gha,scope=${{ matrix.release_type }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release_type }}-${{ matrix.target }}
