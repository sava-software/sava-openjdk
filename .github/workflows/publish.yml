name: Validate and publish OpenJDK base image

on:
  pull_request:
  workflow_dispatch:
  push:
    # Release tags always run (path filters are not evaluated for tag pushes);
    # pushes to main run the validation only when they change a build input.
    branches:
      - main
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
    paths:
      - Dockerfile
      - .dockerignore
      - 'scripts/**'
      - 'tests/**'
      - .github/workflows/publish.yml
      - '.github/scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: &registry-config
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    strategy:
      fail-fast: false
      matrix: &jdk-matrix
        include:
          # Each JDK value is typed once, on the channel's debian entry, and the
          # alpine entry aliases it. The image tags' jdk and os segments are derived
          # in "Resolve release image references", never typed here.
          # GA (General Availability) build, as listed on https://jdk.java.net/.
          - target: debian
            release_type: ga
            java_version: &ga-java-version "27.0.1.0.3"
            java_version_hash: &ga-java-version-hash "b14170c9b2de463d9b89442c6db3e384"
            java_build: &ga-java-build "1"
            jdk_sha256_x64: &ga-jdk-sha256-x64 "256199399aaddc6d66919b5de90794b4263e4ab312aa56692cb63b70a0abef41"
            jdk_sha256_aarch64: &ga-jdk-sha256-aarch64 "a088a727fa3e76ebeadfa76ed9c1e9fecbdfa54ec752ecb669c38a8585e058a1"
          - target: alpine
            release_type: ga
            java_version: *ga-java-version
            java_version_hash: *ga-java-version-hash
            java_build: *ga-java-build
            jdk_sha256_x64: *ga-jdk-sha256-x64
            jdk_sha256_aarch64: *ga-jdk-sha256-aarch64
          # EA (Early Access) build from the early-access download path; the bump
          # commit records which build was the newest and when it was checked.
          - target: debian
            release_type: ea
            java_version: &ea-java-version "28"
            java_version_hash: ""
            java_build: &ea-java-build "21"
            jdk_sha256_x64: &ea-jdk-sha256-x64 "b32bf773d02fff73d4a2da78cf590459879963b3dbffd18dcc9d6c6756ee4549"
            jdk_sha256_aarch64: &ea-jdk-sha256-aarch64 "3908eb08a5a6a074301fffbed99ef8f2a36d0ae42dce41e7c948a3b16a8cfa5a"
          - target: alpine
            release_type: ea
            java_version: *ea-java-version
            java_version_hash: ""
            java_build: *ea-java-build
            jdk_sha256_x64: *ea-jdk-sha256-x64
            jdk_sha256_aarch64: *ea-jdk-sha256-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - &release-image
        name: Resolve release image references
        id: dockerhub
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TYPE: ${{ matrix.release_type }}
          JAVA_VERSION: ${{ matrix.java_version }}
          JAVA_BUILD: ${{ matrix.java_build }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! version=$(jq -er '.["."] | select(type == "string") | select(test("\\A[0-9]+\\.[0-9]+\\.[0-9]+\\z"))' .release-please-manifest.json); then
            echo '::error::The release manifest must contain a string version X.Y.Z under ".".'
            exit 1
          fi
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag && "$version" != "$REF_NAME" ]]; then
            echo '::error::The release manifest version does not match the pushed Git tag.'
            exit 1
          fi
          # Derive the tag's jdk segment from the entry and its os segment from the
          # target stage's FROM line, so neither can disagree with what is built.
          case "$RELEASE_TYPE" in
            ga) jdk_tag="$JAVA_VERSION" ;;
            ea) jdk_tag="${JAVA_VERSION}-ea${JAVA_BUILD}" ;;
            *)
              echo '::error::The matrix release_type must be ga or ea.'
              exit 1
              ;;
          esac
          if ! base=$(awk -v stage="$TARGET" '$1 == "FROM" && NF == 4 && $3 == "AS" && $4 == stage { print $2; n++ } END { if (n != 1) exit 1 }' Dockerfile); then
            echo '::error::The Dockerfile needs exactly one "FROM name:tag@sha256:digest AS target" line for this target.'
            exit 1
          fi
          if [[ ! "$base" =~ ^([a-z0-9]+):([a-z0-9][a-z0-9._-]*)@sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::The target stage must start from an official image pinned as name:tag@sha256:digest.'
            exit 1
          fi
          os_tag="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          tag="${version}-jdk${jdk_tag}-${os_tag}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo '::error::The rendered image tag is invalid; refusing metadata-action tag rewriting.'
            exit 1
          fi
          echo "Image tag: ${tag}"
          # Only load the resolver; the script's subshell entry point does not run.
          # shellcheck source=/dev/null
          source .github/scripts/image-state.sh
          resolve_registry_images
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "ghcr_image=$GHCR_IMAGE"
            echo "image=$DOCKERHUB_IMAGE"
            if [[ -n "$DOCKERHUB_IMAGE" ]]; then
              echo 'enabled=true'
            else
              echo 'enabled=false'
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Check release tag availability
        env:
          VERSION: ${{ steps.dockerhub.outputs.version }}
          IMAGE_TAG: ${{ steps.dockerhub.outputs.tag }}
          GHCR_IMAGE: ${{ steps.dockerhub.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ steps.dockerhub.outputs.image }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            released=true
          else
            status=$?
            if [[ "$status" != 2 ]]; then
              echo '::error::Could not determine whether the release version already has a Git tag.'
              exit "$status"
            fi
            released=false
          fi
          if [[ "$released" == true && ! ( "$EVENT_NAME" == push && "$REF_TYPE" == tag ) ]]; then
            message="version ${VERSION} is already released; this run publishes nothing"
            echo "::notice::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          message="release ${VERSION} will publish"
          echo "::notice::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          references=("${GHCR_IMAGE}:${IMAGE_TAG}")
          if [[ -n "$DOCKERHUB_IMAGE" ]]; then
            references+=("${DOCKERHUB_IMAGE}:${IMAGE_TAG}")
          fi
          printf '%s\n' "${references[@]}"
          printf '\n- %s\n' "${references[@]}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            exit 0
          fi
          state=$(bash .github/scripts/image-state.sh "$IMAGE_TAG")
          if [[ "$state" != absent ]]; then
            echo '::error::An unreleased version must use image tags absent from every configured registry.'
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Check UTF-8 in base and scratch runtimes
        env:
          IMAGE_TARGET: ${{ matrix.target }}
          RELEASE_TYPE: ${{ matrix.release_type }}
          JAVA_VERSION: ${{ matrix.java_version }}
          JAVA_BUILD: ${{ matrix.java_build }}
          JAVA_VERSION_HASH: ${{ matrix.java_version_hash }}
          JDK_SHA256_X64: ${{ matrix.jdk_sha256_x64 }}
          JDK_SHA256_AARCH64: ${{ matrix.jdk_sha256_aarch64 }}
        run: |
          for arch in amd64 arm64; do
            test_image="sava-openjdk:utf8-${RELEASE_TYPE}-${IMAGE_TARGET}-${arch}"
            docker buildx build --load --platform "linux/${arch}" \
              --target "${IMAGE_TARGET}" --tag "${test_image}" \
              --build-arg "JAVA_RELEASE_TYPE=${RELEASE_TYPE}" \
              --build-arg "JAVA_VERSION=${JAVA_VERSION}" \
              --build-arg "JAVA_BUILD=${JAVA_BUILD}" \
              --build-arg "JAVA_VERSION_HASH=${JAVA_VERSION_HASH}" \
              --build-arg "JDK_SHA256_X64=${JDK_SHA256_X64}" \
              --build-arg "JDK_SHA256_AARCH64=${JDK_SHA256_AARCH64}" .
            python3 scripts/test-utf8.py "${test_image}" --platform "linux/${arch}" --timeout 600
            docker image rm "${test_image}"
          done

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-24.04
    env: *registry-config
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: *jdk-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - *release-image

      - name: Docker setup (GHCR)
        uses: sava-software/sava-build/.github/actions/docker-setup@main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read registry state
        id: registry
        env:
          IMAGE_TAG: ${{ steps.dockerhub.outputs.tag }}
        run: bash .github/scripts/image-state.sh "$IMAGE_TAG"

      - name: Decide how to publish this entry
        id: publication
        env:
          STATE: ${{ steps.registry.outputs.state }}
          GHCR_STATUS: ${{ steps.registry.outputs.ghcr_status }}
          DOCKERHUB_STATUS: ${{ steps.registry.outputs.dockerhub_status }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ ! "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Invalid workflow run attempt.'
            exit 1
          fi
          case "$STATE" in
            absent)
              echo 'action=build' >> "$GITHUB_OUTPUT"
              ;;
            published)
              if (( RUN_ATTEMPT > 1 )); then
                echo '::notice::This entry is already published with matching digests; skipping the build and push.'
                echo 'action=skip' >> "$GITHUB_OUTPUT"
              else
                echo '::error::An image tag already exists on the first attempt; refusing to publish.'
                exit 1
              fi
              ;;
            inconsistent)
              if (( RUN_ATTEMPT > 1 )) && [[ "$DOCKERHUB_STATUS" == present && "$GHCR_STATUS" == absent ]]; then
                echo 'action=copy' >> "$GITHUB_OUTPUT"
              else
                echo '::error::Registry state is inconsistent; refusing to build or overwrite an existing tag. See the registry status and digest report.'
                if [[ "$GHCR_STATUS" == present && "$DOCKERHUB_STATUS" == absent ]]; then
                  echo '::error::Maintainer recovery: read org.opencontainers.image.revision on the GHCR image. Only if it equals the release commit, copy that digest to Docker Hub with docker buildx imagetools create, then use Re-run failed jobs.'
                fi
                exit 1
              fi
              ;;
            *)
              echo '::error::No readable registry state; refusing to publish.'
              exit 1
              ;;
          esac

      - name: Copy the existing Docker Hub image to GHCR
        id: copy
        if: steps.publication.outputs.action == 'copy'
        env:
          IMAGE_TAG: ${{ steps.dockerhub.outputs.tag }}
          GHCR_IMAGE: ${{ steps.registry.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ steps.registry.outputs.dockerhub_image }}
          SOURCE_DIGEST: ${{ steps.registry.outputs.dockerhub_digest }}
        run: |
          docker buildx imagetools create --tag "${GHCR_IMAGE}:${IMAGE_TAG}" "${DOCKERHUB_IMAGE}@${SOURCE_DIGEST}"

      - name: Build and push (${{ matrix.release_type }} ${{ matrix.target }})
        id: build
        if: steps.publication.outputs.action == 'build'
        uses: sava-software/sava-build/.github/actions/docker-build-image@main
        with:
          image: |
            ${{ steps.dockerhub.outputs.enabled == 'true' && steps.dockerhub.outputs.image || '' }}
            ${{ steps.dockerhub.outputs.ghcr_image }}
          dockerfile: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            JAVA_RELEASE_TYPE=${{ matrix.release_type }}
            JAVA_VERSION=${{ matrix.java_version }}
            JAVA_BUILD=${{ matrix.java_build }}
            JAVA_VERSION_HASH=${{ matrix.java_version_hash }}
            JDK_SHA256_X64=${{ matrix.jdk_sha256_x64 }}
            JDK_SHA256_AARCH64=${{ matrix.jdk_sha256_aarch64 }}
          tags: |
            type=raw,value=${{ steps.dockerhub.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.release_type }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release_type }}-${{ matrix.target }}

      - name: Read registry state after publication attempt
        id: postcheck
        if: &publication-attempted ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure' || steps.copy.outcome == 'success' || steps.copy.outcome == 'failure') }}
        env:
          IMAGE_TAG: ${{ steps.dockerhub.outputs.tag }}
        run: bash .github/scripts/image-state.sh --wait "$IMAGE_TAG"

      - name: Verify the published digest
        if: *publication-attempted
        env:
          STATE: ${{ steps.postcheck.outputs.state }}
          GHCR_STATUS: ${{ steps.postcheck.outputs.ghcr_status }}
          DOCKERHUB_STATUS: ${{ steps.postcheck.outputs.dockerhub_status }}
          OBSERVED_DIGEST: ${{ steps.postcheck.outputs.ghcr_digest }}
          EXPECTED_DIGEST: ${{ steps.publication.outputs.action == 'copy' && steps.registry.outputs.dockerhub_digest || steps.build.outputs.digest }}
        run: |
          if [[ -z "$STATE" || "$STATE" == error ]]; then
            echo '::error::Registry state could not be read after the publication attempt.'
            exit 1
          fi
          if [[ "$STATE" == published && "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ && "$OBSERVED_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo '::error::The tag holds a digest this run did not build or copy. Investigate the unexpected digest; do not re-run.'
            exit 1
          fi
          if [[ "$STATE" != published || ! "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ || "$OBSERVED_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo '::error::The configured registries do not confirm the expected published digest. Use Re-run failed jobs to finish a partially published entry; do not move or push the release Git tag again.'
            if [[ "$GHCR_STATUS" == present && "$DOCKERHUB_STATUS" == absent ]]; then
              echo '::error::Maintainer recovery: read org.opencontainers.image.revision on the GHCR image. Only if it equals the release commit, copy that digest to Docker Hub with docker buildx imagetools create before re-running the failed jobs.'
            fi
            exit 1
          fi
          echo "::notice::Publication verified at ${OBSERVED_DIGEST}."
