name: Validate and publish OpenJDK base image

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: &jdk-matrix
        include:
          # GA (General Availability) builds.
          - target: debian
            release_type: ga
            java_version: "27"
            java_build: "35"
            java_version_hash: "55ce5470a6294008af0057ff4626d0e5"
            jdk_sha256_x64: "95fc37eb3a18a27a26d5904c2d89d52bace8dafa9a078ca27f4747fbc4bf070b"
            jdk_sha256_aarch64: "da4e9dde1fff90204739e969187bab4751bd59a2a1c479672e1a1810f7dd23ea"
            jdk_tag: "27"
            os_tag: "debian-trixie"
          - target: alpine
            release_type: ga
            java_version: "27"
            java_build: "35"
            java_version_hash: "55ce5470a6294008af0057ff4626d0e5"
            jdk_sha256_x64: "95fc37eb3a18a27a26d5904c2d89d52bace8dafa9a078ca27f4747fbc4bf070b"
            jdk_sha256_aarch64: "da4e9dde1fff90204739e969187bab4751bd59a2a1c479672e1a1810f7dd23ea"
            jdk_tag: "27"
            os_tag: "alpine-3.24"
          # EA (Early Access) builds. 28 build 18 is the latest build published on the
          # early-access download path (https://jdk.java.net/28/).
          - target: debian
            release_type: ea
            java_version: "28"
            java_build: "18"
            java_version_hash: ""
            jdk_sha256_x64: "9901071672629d07caff1d5d50db34cecabf36aa3336e9fad4dbed5e8876fa40"
            jdk_sha256_aarch64: "2303bdc1f3afaebd79e81fbcf4d5ca707c9bc645170f0e3a328ba717f6916b9d"
            jdk_tag: "28-ea18"
            os_tag: "debian-trixie"
          - target: alpine
            release_type: ea
            java_version: "28"
            java_build: "18"
            java_version_hash: ""
            jdk_sha256_x64: "9901071672629d07caff1d5d50db34cecabf36aa3336e9fad4dbed5e8876fa40"
            jdk_sha256_aarch64: "2303bdc1f3afaebd79e81fbcf4d5ca707c9bc645170f0e3a328ba717f6916b9d"
            jdk_tag: "28-ea18"
            os_tag: "alpine-3.24"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Check UTF-8 in base and scratch runtimes
        env:
          IMAGE_TARGET: ${{ matrix.target }}
          RELEASE_TYPE: ${{ matrix.release_type }}
          JAVA_VERSION: ${{ matrix.java_version }}
          JAVA_BUILD: ${{ matrix.java_build }}
          JAVA_VERSION_HASH: ${{ matrix.java_version_hash }}
          JDK_SHA256_X64: ${{ matrix.jdk_sha256_x64 }}
          JDK_SHA256_AARCH64: ${{ matrix.jdk_sha256_aarch64 }}
        run: |
          for arch in amd64 arm64; do
            test_image="sava-openjdk:utf8-${RELEASE_TYPE}-${IMAGE_TARGET}-${arch}"
            docker buildx build --load --platform "linux/${arch}" \
              --target "${IMAGE_TARGET}" --tag "${test_image}" \
              --build-arg "JAVA_RELEASE_TYPE=${RELEASE_TYPE}" \
              --build-arg "JAVA_VERSION=${JAVA_VERSION}" \
              --build-arg "JAVA_BUILD=${JAVA_BUILD}" \
              --build-arg "JAVA_VERSION_HASH=${JAVA_VERSION_HASH}" \
              --build-arg "JDK_SHA256_X64=${JDK_SHA256_X64}" \
              --build-arg "JDK_SHA256_AARCH64=${JDK_SHA256_AARCH64}" .
            python3 scripts/test-utf8.py "${test_image}" --platform "linux/${arch}" --timeout 600
            docker image rm "${test_image}"
          done

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: *jdk-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve Docker Hub image name
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            image="${DOCKERHUB_IMAGE}"
            if [ -z "${image}" ]; then
              image="${DOCKERHUB_USERNAME}/sava-openjdk"
            fi
            echo "image=${image}" >> "${GITHUB_OUTPUT}"
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Docker setup (GHCR)
        uses: sava-software/sava-build/.github/actions/docker-setup@main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.release_type }} ${{ matrix.jdk_tag }} ${{ matrix.os_tag }})
        uses: sava-software/sava-build/.github/actions/docker-build-image@main
        with:
          image: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && steps.dockerhub.outputs.image || '' }}
          dockerfile: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            JAVA_RELEASE_TYPE=${{ matrix.release_type }}
            JAVA_VERSION=${{ matrix.java_version }}
            JAVA_BUILD=${{ matrix.java_build }}
            JAVA_VERSION_HASH=${{ matrix.java_version_hash }}
            JDK_SHA256_X64=${{ matrix.jdk_sha256_x64 }}
            JDK_SHA256_AARCH64=${{ matrix.jdk_sha256_aarch64 }}
          tags: |
            type=raw,value=${{ matrix.jdk_tag }}-${{ matrix.os_tag }}
          cache-from: type=gha,scope=${{ matrix.release_type }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release_type }}-${{ matrix.target }}
